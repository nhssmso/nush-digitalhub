<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Washroom Pass</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --green: #10b981;
      --red: #ef4444;
      --yellow: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 40px;
      overflow: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .room-title { font-size: 2.2rem; font-weight: 800; letter-spacing: -1px; }
    .clock { font-size: 2.2rem; font-family: monospace; color: var(--text-muted); }

    /* Traffic Sign Banner */
    .traffic-sign {
      flex: 1;
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      transition: all 0.4s ease;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      text-align: center;
    }

    .status-green {
      background: radial-gradient(circle at center, #064e3b 0%, #022c22 100%);
      border: 4px solid var(--green);
      box-shadow: 0 0 60px rgba(16, 185, 129, 0.3);
    }

    .status-red {
      background: radial-gradient(circle at center, #7f1d1d 0%, #450a0a 100%);
      border: 4px solid var(--red);
      box-shadow: 0 0 60px rgba(239, 68, 68, 0.3);
    }

    .icon {
      font-size: 8rem;
      line-height: 1;
    }

    .status-headline {
      font-size: 4.5rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .status-sub {
      font-size: 1.8rem;
      color: #e2e8f0;
      font-weight: 500;
    }

    /* Bottom Info Bar */
    .footer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 30px;
      height: 180px;
    }

    .info-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .card-label { font-size: 1.1rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 8px; }
    .card-val { font-size: 2rem; font-weight: 700; }
  </style>
</head>
<body>

  <header>
    <div class="room-title" id="venueLabel">School Hall &bull; Washroom Monitor</div>
    <div class="clock" id="liveClock">00:00:00</div>
  </header>

  <!-- Big Traffic Indicator -->
  <div id="trafficSign" class="traffic-sign status-green">
    <div class="icon" id="statusIcon">🚻 🟢</div>
    <div class="status-headline" id="statusText">AVAILABLE</div>
    <div class="status-sub" id="statusDetail">Pass is open &bull; Please scan before leaving</div>
  </div>

  <!-- Bottom Details -->
  <div class="footer-grid">
    <div class="info-card">
      <div class="card-label">Currently Out</div>
      <div class="card-val" id="activeNames">None</div>
    </div>
    <div class="info-card">
      <div class="card-label">Next in Line (Waitlist)</div>
      <div class="card-val" id="nextName">Queue is empty</div>
    </div>
  </div>

  <script>
    // Live Clock
    setInterval(() => {
      document.getElementById('liveClock').textContent = new Date().toLocaleTimeString();
    }, 1000);

    // Sync via LocalStorage / BroadcastChannel (works instantly across browser tabs)
    function refreshDisplay() {
      const active = JSON.parse(localStorage.getItem('passTracker_active') || '[]');
      const waitlist = JSON.parse(localStorage.getItem('passTracker_waitlist') || '[]');
      const limit = parseInt(localStorage.getItem('passTracker_limit') || '2', 10);
      const venue = localStorage.getItem('passTracker_venue') || 'School Hall';

      document.getElementById('venueLabel').textContent = `${venue} • Washroom Monitor`;

      const sign = document.getElementById('trafficSign');
      const icon = document.getElementById('statusIcon');
      const text = document.getElementById('statusText');
      const detail = document.getElementById('statusDetail');
      const activeNames = document.getElementById('activeNames');
      const nextName = document.getElementById('nextName');

      // Update Names
      activeNames.textContent = active.length > 0 
        ? active.map(s => `${s.name} (${s.class})`).join(', ')
        : "None (All present)";

      nextName.textContent = waitlist.length > 0 
        ? `${waitlist[0].name} (${waitlist[0].class})`
        : "Queue is empty";

      // Toggle Traffic Signal State
      if (active.length >= limit) {
        sign.className = "traffic-sign status-red";
        icon.textContent = "🚷 🔴";
        text.textContent = "OCCUPIED";
        detail.textContent = "Capacity reached • Please wait for your turn";
      } else {
        sign.className = "traffic-sign status-green";
        icon.textContent = "🚻 🟢";
        text.textContent = "AVAILABLE";
        detail.textContent = `${limit - active.length} pass(es) available • Scan to go`;
      }
    }

    // Listen for storage updates from the scanner screen
    window.addEventListener('storage', refreshDisplay);
    setInterval(refreshDisplay, 2000); // Polling backup
    refreshDisplay();
  </script>
</body>
</html>
