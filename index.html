<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Movement Tracker</title>
  
  <!-- HTML5-QRCode Library -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #f1f5f9;
      --border-focus: #c084fc;
      --text: #1e1b4b;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;
      
      /* Dashboard Screenshot Palette */
      --primary-pink: #d946ef;
      --primary-pink-hover: #c026d3;
      --purple-card: #8b5cf6;
      --purple-hover: #7c3aed;
      --teal-cyan: #06b6d4;
      --teal-hover: #0891b2;
      --amber-gold: #f59e0b;
      --emerald-green: #10b981;
      
      --badge-bg: #fdf4ff;
      --badge-text: #c026d3;
      --card-shadow: 0 4px 20px -2px rgba(112, 144, 176, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 20px 24px;
      background: var(--surface);
      border-radius: 16px;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-title h1 {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .header-title p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .control-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .control-item label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    input, select {
      background: #fafafa;
      border: 1px solid #e2e8f0;
      color: var(--text);
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      outline: none;
      transition: all 0.2s ease;
      max-width: 100%;
    }

    input:focus, select:focus {
      border-color: var(--border-focus);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(217, 70, 239, 0.1);
    }

    button {
      background: var(--primary-pink);
      color: #ffffff;
      border: none;
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    button:hover {
      background: var(--primary-pink-hover);
      transform: translateY(-1px);
    }

    .btn-camera {
      background: var(--purple-card);
      color: #ffffff;
    }

    .btn-camera:hover {
      background: var(--purple-hover);
    }

    .btn-secondary {
      background: #f0fdfa;
      color: var(--teal-hover);
      border: 1px solid #ccfbf1;
    }

    .btn-secondary:hover {
      background: #ccfbf1;
    }

    .btn-danger-outline {
      background: #fff1f2;
      color: #e11d48;
      border: 1px solid #ffe4e6;
      font-size: 0.78rem;
      padding: 6px 12px;
    }

    .btn-danger-outline:hover {
      background: #ffe4e6;
    }

    /* Entry & Scanner */
    .entry-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #reader {
      width: 100%;
      max-width: 340px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      border: 2px dashed #e9d5ff;
      display: none;
    }

    .input-row {
      display: grid;
      grid-template-columns: 2fr 1.5fr 1fr auto;
      gap: 10px;
    }

    /* Active & Waitlist Grid */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .panel-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    .panel-count {
      font-size: 0.8rem;
      color: var(--purple-card);
      background: #f5f3ff;
      padding: 3px 8px;
      border-radius: 8px;
      font-weight: 700;
    }

    /* Queue & Item Cards */
    .queue-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .student-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: #fafafa;
      border: 1px solid #f1f5f9;
      border-radius: 12px;
      gap: 8px;
    }

    .student-info {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .student-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
    }

    .student-class {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--badge-text);
      background: var(--badge-bg);
      border: 1px solid #fae8ff;
      padding: 2px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .student-id {
      font-size: 0.75rem;
      color: var(--text-subtle);
    }

    .timer {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      white-space: nowrap;
    }

    .timer.normal { color: var(--teal-hover); border-color: #99f6e4; background: #f0fdfa; }
    .timer.warning { color: var(--amber-gold); border-color: #fde68a; background: #fffbeb; }
    .timer.danger { color: #e11d48; border-color: #fecdd3; background: #fff1f2; }

    .btn-return {
      padding: 5px 12px;
      font-size: 0.78rem;
      background: var(--teal-cyan);
      border-radius: 8px;
    }

    .btn-return:hover {
      background: var(--teal-hover);
    }

    .empty-state {
      font-size: 0.825rem;
      color: var(--text-subtle);
      padding: 16px 0;
      text-align: center;
    }

    /* Scrollable Table */
    .table-container {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      min-width: 580px;
      border-collapse: collapse;
      font-size: 0.825rem;
      text-align: left;
    }

    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    th {
      font-weight: 700;
      color: var(--text-muted);
      background: #fafafa;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .history-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    @media (max-width: 768px) {
      body {
        padding: 16px 12px;
      }
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      .controls-bar {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .controls-bar button {
        grid-column: span 2;
        width: 100%;
      }
      .input-row {
        grid-template-columns: 1fr;
      }
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="header-title">
        <h1>Movement Tracker</h1>
        <p>Washroom Pass Management</p>
      </div>

      <div class="controls-bar">
        <div class="control-item">
          <label>Venue</label>
          <select id="venueSelect" onchange="saveAllData()">
            <option value="School Hall">School Hall</option>
            <option value="Indoor sports hall">Indoor sports hall</option>
            <option value="A03-02">A03-02</option>
            <option value="B06-03">B06-03</option>
            <option value="C05-07">C05-07</option>
            <option value="E1-09">E1-09</option>
            <option value="Library">Library</option>
            <option value="Event Horizon">Event Horizon</option>
          </select>
        </div>

        <div class="control-item">
          <label>Date</label>
          <input type="date" id="dateInput" onchange="saveAllData()" />
        </div>

        <div class="control-item">
          <label>Pass Limit</label>
          <select id="limitSelect" onchange="updatePassLimit()">
            <option value="1">1</option>
            <option value="2" selected>2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
        </div>

        <button id="toggleCameraBtn" class="btn-camera" onclick="toggleCameraScanner()">
          📷 Camera
        </button>
      </div>
    </header>

    <!-- Scan & Manual Entry -->
    <div class="entry-card">
      <div id="reader"></div>

      <div class="input-row">
        <input type="text" id="barcodeInput" placeholder="Scan Barcode ID or type..." autofocus autocomplete="off" />
        <input type="text" id="nameInput" placeholder="Student Name" />
        <input type="text" id="classInput" placeholder="Class" />
        <button onclick="handleManualSubmit()">Record</button>
      </div>
    </div>

    <!-- Active Movement & Waitlist Grid -->
    <div class="dashboard-grid">
      <!-- Currently Out -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Currently Out</span>
          <span class="panel-count" id="activeCount">0 / 2</span>
        </div>
        <ul class="queue-list" id="activeList"></ul>
      </div>

      <!-- Waitlist -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Waiting List</span>
          <span class="panel-count" id="waitCount">0 in line</span>
        </div>
        <ul class="queue-list" id="waitList"></ul>
      </div>
    </div>

    <!-- Movement Log -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Movement Log</span>
        <div class="history-actions">
          <button class="btn-secondary" style="padding: 6px 12px; font-size: 0.78rem;" onclick="exportToCSV()">
            📥 Export CSV
          </button>
          <button class="btn-danger-outline" onclick="clearDailyLog()">
            Clear
          </button>
        </div>
      </div>
      
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Venue</th>
              <th>Student</th>
              <th>Class</th>
              <th>Departed</th>
              <th>Returned</th>
              <th>Duration</th>
            </tr>
          </thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let maxActivePasses = parseInt(localStorage.getItem('passTracker_limit') || '2', 10);
    let activeStudents = JSON.parse(localStorage.getItem('passTracker_active') || '[]');
    let waitlist = JSON.parse(localStorage.getItem('passTracker_waitlist') || '[]');
    let movementHistory = JSON.parse(localStorage.getItem('passTracker_history') || '[]');

    const studentDirectory = {
      "S1001": { name: "Alex Tan", class: "3-Integrity" },
      "S1002": { name: "Sarah Lim", class: "3-Integrity" },
      "S1003": { name: "Marcus Lee", class: "3-Integrity" },
      "S2001": { name: "David Wong", class: "3-Respect" },
      "S2002": { name: "Nurul Aisyah", class: "3-Respect" },
      "S2003": { name: "Rachel Chen", class: "3-Respect" }
    };

    let html5QrCode = null;
    let isCameraRunning = false;
    let lastScanTime = 0;
    const SCAN_COOLDOWN_MS = 2000;

    const barcodeInput = document.getElementById("barcodeInput");
    const nameInput = document.getElementById("nameInput");
    const classInput = document.getElementById("classInput");
    const venueSelect = document.getElementById("venueSelect");
    const limitSelect = document.getElementById("limitSelect");
    const dateInput = document.getElementById("dateInput");
    const readerDiv = document.getElementById("reader");
    const toggleCameraBtn = document.getElementById("toggleCameraBtn");

    dateInput.value = localStorage.getItem('passTracker_date') || new Date().toISOString().split('T')[0];
    venueSelect.value = localStorage.getItem('passTracker_venue') || 'School Hall';
    limitSelect.value = maxActivePasses.toString();

    function saveAllData() {
      localStorage.setItem('passTracker_history', JSON.stringify(movementHistory));
      localStorage.setItem('passTracker_active', JSON.stringify(activeStudents));
      localStorage.setItem('passTracker_waitlist', JSON.stringify(waitlist));
      localStorage.setItem('passTracker_limit', maxActivePasses.toString());
      localStorage.setItem('passTracker_venue', venueSelect.value);
      localStorage.setItem('passTracker_date', dateInput.value);
    }

    function updatePassLimit() {
      maxActivePasses = parseInt(limitSelect.value, 10);
      checkAndPromoteWaitlist();
      saveAllData();
      render();
    }

    barcodeInput.addEventListener("input", () => {
      const id = barcodeInput.value.trim();
      if (studentDirectory[id]) {
        nameInput.value = studentDirectory[id].name;
        classInput.value = studentDirectory[id].class;
      }
    });

    barcodeInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        const id = barcodeInput.value.trim();
        if (id) processBarcode(id);
      }
    });

    function processBarcode(id) {
      const activeIndex = activeStudents.findIndex(s => s.id === id);
      if (activeIndex !== -1) {
        checkInStudent(activeIndex);
        resetInputs();
        return;
      }

      let name = nameInput.value.trim();
      let cls = classInput.value.trim();

      if (studentDirectory[id]) {
        name = studentDirectory[id].name;
        cls = studentDirectory[id].class;
      }

      if (!name) {
        alert("Please enter the student's name before recording.");
        nameInput.focus();
        return;
      }

      processStudentRequest(id, name, cls || "N/A");
      resetInputs();
    }

    function handleManualSubmit() {
      const id = barcodeInput.value.trim();
      let name = nameInput.value.trim();
      let cls = classInput.value.trim();

      if (!id && !name) {
        alert("Please key in the Student ID or Name to record.");
        barcodeInput.focus();
        return;
      }

      if (id && studentDirectory[id]) {
        name = studentDirectory[id].name;
        cls = studentDirectory[id].class;
      }

      const finalId = id || `ID-${Math.floor(1000 + Math.random() * 9000)}`;

      if (!name) {
        alert("Please key in the Student Name.");
        nameInput.focus();
        return;
      }

      const activeIndex = activeStudents.findIndex(s => s.id === finalId);
      if (activeIndex !== -1) {
        checkInStudent(activeIndex);
      } else {
        processStudentRequest(finalId, name, cls || "N/A");
      }
      resetInputs();
    }

    function processStudentRequest(id, name, cls) {
      if (waitlist.some(s => s.id === id)) {
        alert(`${name} is already in the waitlist.`);
        return;
      }

      const student = {
        id,
        name,
        class: cls,
        venue: venueSelect.value,
        date: dateInput.value,
        startTime: null
      };

      if (activeStudents.length < maxActivePasses) {
        student.startTime = Date.now();
        activeStudents.push(student);
      } else {
        waitlist.push(student);
      }
      saveAllData();
      render();
    }

    function checkInStudent(index) {
      const returnedStudent = activeStudents.splice(index, 1)[0];
      const endTime = Date.now();
      const durationSec = Math.round((endTime - returnedStudent.startTime) / 1000);

      movementHistory.unshift({
        date: returnedStudent.date,
        venue: returnedStudent.venue,
        name: returnedStudent.name,
        id: returnedStudent.id,
        class: returnedStudent.class,
        departed: new Date(returnedStudent.startTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        returned: new Date(endTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        duration: formatDuration(durationSec)
      });

      checkAndPromoteWaitlist();
      saveAllData();
      render();
    }

    function checkAndPromoteWaitlist() {
      while (activeStudents.length < maxActivePasses && waitlist.length > 0) {
        const nextStudent = waitlist.shift();
        nextStudent.startTime = Date.now();
        activeStudents.push(nextStudent);
      }
    }

    function exportToCSV() {
      if (movementHistory.length === 0) {
        alert("No movement records to export.");
        return;
      }

      const headers = ["Date", "Venue", "Student Name", "Student ID", "Class", "Departed", "Returned", "Duration"];
      const rows = movementHistory.map(item => [
        `"${item.date}"`,
        `"${item.venue || venueSelect.value}"`,
        `"${item.name}"`,
        `"${item.id}"`,
        `"${item.class}"`,
        `"${item.departed}"`,
        `"${item.returned}"`,
        `"${item.duration}"`
      ]);

      const csvContent = [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `Movement_Log_${dateInput.value}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function clearDailyLog() {
      if (confirm("Are you sure you want to clear all movement logs, active passes, and waitlist records?")) {
        movementHistory = [];
        activeStudents = [];
        waitlist = [];
        saveAllData();
        render();
      }
    }

    function formatDuration(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}m ${secs}s`;
    }

    function formatTimer(ms) {
      const totalSecs = Math.floor(ms / 1000);
      const mins = String(Math.floor(totalSecs / 60)).padStart(2, '0');
      const secs = String(totalSecs % 60).padStart(2, '0');
      return { text: `${mins}:${secs}`, totalSecs };
    }

    function resetInputs() {
      barcodeInput.value = "";
      nameInput.value = "";
      classInput.value = "";
      barcodeInput.focus();
    }

    function toggleCameraScanner() {
      if (isCameraRunning) {
        stopCamera();
      } else {
        startCamera();
      }
    }

    function startCamera() {
      readerDiv.style.display = "block";
      html5QrCode = new Html5Qrcode("reader");

      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 220, height: 140 }, aspectRatio: 1.777778 },
        (decodedText) => {
          const now = Date.now();
          if (now - lastScanTime < SCAN_COOLDOWN_MS) return;
          lastScanTime = now;
          processBarcode(decodedText);
        },
        () => {}
      ).then(() => {
        isCameraRunning = true;
        toggleCameraBtn.textContent = "Stop Camera";
        toggleCameraBtn.style.background = "#e11d48";
      }).catch(() => {
        alert("Unable to access camera.");
        readerDiv.style.display = "none";
      });
    }

    function stopCamera() {
      if (html5QrCode && isCameraRunning) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          readerDiv.style.display = "none";
          isCameraRunning = false;
          toggleCameraBtn.textContent = "📷 Camera";
          toggleCameraBtn.style.background = "var(--purple-card)";
        });
      }
    }

    function render() {
      document.getElementById("activeCount").textContent = `${activeStudents.length} / ${maxActivePasses}`;
      document.getElementById("waitCount").textContent = `${waitlist.length} in line`;

      const activeList = document.getElementById("activeList");
      activeList.innerHTML = activeStudents.length === 0 ? `<li class="empty-state">No students currently out.</li>` : "";

      activeStudents.forEach((s, idx) => {
        const elapsedMs = Date.now() - s.startTime;
        const { text, totalSecs } = formatTimer(elapsedMs);

        let timerClass = "normal";
        if (totalSecs >= 600) timerClass = "danger";
        else if (totalSecs >= 300) timerClass = "warning";

        const li = document.createElement("li");
        li.className = "student-row";
        li.innerHTML = `
          <div class="student-info">
            <span class="student-name">${s.name}</span>
            <span class="student-class">${s.class}</span>
            <span class="student-id">#${s.id}</span>
          </div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <span class="timer ${timerClass}">${text}</span>
            <button class="btn-return" onclick="checkInStudent(${idx})">Return</button>
          </div>
        `;
        activeList.appendChild(li);
      });

      const waitListEl = document.getElementById("waitList");
      waitListEl.innerHTML = waitlist.length === 0 ? `<li class="empty-state">No students waiting.</li>` : "";

      waitlist.forEach((s, idx) => {
        const li = document.createElement("li");
        li.className = "student-row";
        li.innerHTML = `
          <div class="student-info">
            <span style="font-weight: 700; font-size: 0.8rem; color: var(--purple-card); width: 18px;">${idx + 1}.</span>
            <span class="student-name">${s.name}</span>
            <span class="student-class">${s.class}</span>
          </div>
          <span class="student-id">Queued</span>
        `;
        waitListEl.appendChild(li);
      });

      const historyBody = document.getElementById("historyBody");
      historyBody.innerHTML = movementHistory.length === 0 
        ? `<tr><td colspan="7" class="empty-state">No recorded movements yet.</td></tr>`
        : movementHistory.map(item => `
          <tr>
            <td>${item.date || dateInput.value}</td>
            <td><span class="student-class">${item.venue || 'N/A'}</span></td>
            <td><strong>${item.name}</strong> <span class="student-id">(${item.id})</span></td>
            <td><span class="student-class">${item.class}</span></td>
            <td>${item.departed}</td>
            <td>${item.returned}</td>
            <td><strong>${item.duration}</strong></td>
          </tr>
        `).join("");
    }

    setInterval(() => {
      if (activeStudents.length > 0) render();
    }, 1000);

    render();
  </script>
</body>
</html>
